name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 LTS. The action versions below run on Node 24, the runtime GitHub requires since September 2026.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages base path
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> $GITHUB_ENV
            echo "SITE=https://$OWNER.github.io" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/$REPO_NAME" >> $GITHUB_ENV
            echo "SITE=https://$OWNER.github.io/$REPO_NAME" >> $GITHUB_ENV
          fi

      # npm ci installs exactly the versions in package-lock.json (reproducible builds).
      # If you add or update a dependency, run "npm install" locally and commit package-lock.json too.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
