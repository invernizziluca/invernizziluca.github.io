      mine:
        de: "Planung und Umsetzung der Inhalte, Überarbeitung der Website, Kommunikation mit Sponsoren."
        en: "Planning and producing content, reworking the website, communicating with sponsors."
        it: "Pianificazione e realizzazione dei contenuti, revisione del sito, comunicazione con gli sponsor."
      credit:
        de: "Die Zahlen gelten für das ganze Vereinskonto im Zeitraum, nicht nur für meine Beiträge."
        en: "The numbers cover the club's whole account in that period, not only my posts."
        it: "I numeri riguardano l'intero account del club nel periodo, non solo i miei post."
