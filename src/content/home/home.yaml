  feature:
    id: "applaus-2026"
    org: "Initiative Musik"
    year: "2026"
    title:
      de: "APPLAUS 2026: Texte für Social Media"
      en: "APPLAUS 2026: social media copy"
      it: "APPLAUS 2026: testi per i social"
    text:
      de: "Der APPLAUS-Award zeichnet Livemusikspielstätten und Konzertreihen für ihre Musikprogramme aus. Die Preisverleihung 2026 findet am 24. November im Waschhaus Potsdam statt. Für die Beiträge rund um die Live-Acts und das Musikprogramm habe ich auf Instagram einen Großteil der Texte geschrieben."
      en: "The APPLAUS award honours live music venues and concert series for their programmes. The 2026 ceremony takes place on 24 November at Waschhaus Potsdam. For the posts about the live acts and the music programme I wrote most of the Instagram copy."
      it: "Il premio APPLAUS riconosce locali di musica dal vivo e rassegne di concerti per la loro programmazione. La premiazione 2026 si terrà il 24 novembre al Waschhaus di Potsdam. Per i post sui live act e sul programma musicale ho scritto gran parte dei testi su Instagram."
    mine:
      de: "Texte für einen Großteil der veröffentlichten APPLAUS-Beiträge."
      en: "Copy for most of the published APPLAUS posts."
      it: "I testi di gran parte dei post APPLAUS pubblicati."
    credit:
      de: "Fotos, Grafiken und Leitung der Kampagne: Initiative Musik und Rechteinhaber:innen. Die Bilder zeigen veröffentlichte Beiträge, nicht meine Gestaltung."
      en: "Photos, graphics and campaign lead: Initiative Musik and the rights holders. The images show published posts, not my design."
      it: "Foto, grafiche e guida della campagna: Initiative Musik e titolari dei diritti. Le immagini mostrano post pubblicati, non una mia grafica."
    images:
      - src: "/images/works/initiative-musik/applaus-2026/kapa-tult.jpg"
        alt:
          de: "APPLAUS-Visual zum Live-Act Kapa Tult, APPLAUS-Award 2026 Potsdam"
          en: "APPLAUS visual for the live act Kapa Tult, APPLAUS Award 2026 Potsdam"
          it: "Visual APPLAUS per il live act Kapa Tult, APPLAUS Award 2026 Potsdam"
      - src: "/images/works/initiative-musik/applaus-2026/so-sorry.jpg"
        alt:
          de: "APPLAUS-Visual zum Live-Act SO SORRY"
          en: "APPLAUS visual for the live act SO SORRY"
          it: "Visual APPLAUS per il live act SO SORRY"
      - src: "/images/works/initiative-musik/applaus-2026/kama-orchestra.jpg"
        alt:
