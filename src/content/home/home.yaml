      en: "A music lover from Italian-speaking Switzerland, I moved to Berlin to help artists share their music with the world."
      it: "Appassionato di musica dalla Svizzera italiana, mi sono trasferito a Berlino per aiutare artiste e artisti a condividere la loro musica con il mondo."
