# Chapters 01–03 of the story (the numbers are added automatically)
werdegang:
  name:
    de: "Werdegang"
    en: "My path"
    it: "Percorso"
  title:
    de: "Mein Weg in die Musikbranche."
    en: "My way into the music industry."
    it: "Il mio percorso verso la musica."
  intro:
    de: "Kein gerader Weg, aber ein klares Ziel: die Musik. Das Studium gibt mir den Blick fürs Ganze, Mailand und Berlin die Praxis."
    en: "Not a straight line, but a clear goal: music. My studies give me the bigger picture, Milan and Berlin the practice."
    it: "Non una linea retta, ma un obiettivo chiaro: la musica. Lo studio mi dà la visione d'insieme, Milano e Berlino la pratica."
  chapters:
    - id: "ursprung"
      years: "2018–2023"
      name:
        de: "Ursprung"
        en: "Origin"
        it: "Origini"
      title:
        de: "Lehre und Matura im Tessin"
        en: "Apprenticeship and baccalaureate in Ticino"
        it: "Apprendistato e maturità in Ticino"
      text:
        de: "Meine Ausbildung habe ich in Bellinzona gemacht: zuerst die Lehre als Automatiker EFZ mit Berufsmaturität, danach die gymnasiale Maturität (Passerelle). Damit stand mir der Weg an die Hochschule offen."
        en: "I did my schooling in Bellinzona: first an apprenticeship as an automation technician (EFZ) with a vocational baccalaureate, then the academic baccalaureate (Passerelle). That opened the way to university."
        it: "Mi sono formato a Bellinzona: prima l'apprendistato come automatico AFC con maturità professionale, poi la maturità liceale (passerella). Così si è aperta la strada verso l'università."
      image:
        src: "/images/education/kantonsschule-graduation.webp"
        position: "center 35%"
        alt:
          de: "Klassenfoto bei der Maturfeier in Bellinzona"
          en: "Class photo at the graduation ceremony in Bellinzona"
          it: "Foto di classe alla cerimonia di maturità a Bellinzona"
      link:
        label:
          de: "Ausbildung ansehen"
          en: "View my education"
          it: "Vedi la formazione"
        href: "/ausbildung/kantonsschule/"
    - id: "business"
      years:
        de: "seit 2024"
        en: "since 2024"
        it: "dal 2024"
      name:
        de: "Business"
        en: "Business"
        it: "Business"
      title:
        de: "Wirtschaft verstehen"
        en: "Understanding business"
        it: "Capire l'economia"
      text:
        de: "Bachelor of Science in Business Administration an der FFHS, Vertiefung Digital Business. In meinen Forschungsarbeiten untersuche ich, was mich beruflich antreibt: wie Fans die Authentizität von Musikacts auf Social Media wahrnehmen und wie Social-Media-Marketing den Markenwert beeinflusst."
        en: "Bachelor of Science in Business Administration at FFHS, majoring in Digital Business. My research looks at what drives me professionally: how fans perceive the authenticity of music acts on social media, and how social media marketing affects brand equity."
        it: "Bachelor of Science in Business Administration alla FFHS, indirizzo Digital Business. Nei miei lavori di ricerca studio ciò che mi motiva: come i fan percepiscono l'autenticità dei music act sui social e come il social media marketing influenza il valore del brand."
      image:
        src: "/images/education/ffhs-campus.webp"
        alt:
          de: "Blick über Zürich, wo die FFHS einen ihrer Standorte hat"
          en: "View over Zurich, one of the FFHS locations"
          it: "Vista su Zurigo, una delle sedi della FFHS"
      link:
        label:
          de: "Studium ansehen"
          en: "View studies"
          it: "Vedi gli studi"
        href: "/ausbildung/ffhs/"
    - id: "berlin"
      years: "2024–2025"
      name:
        de: "Berlin"
        en: "Berlin"
        it: "Berlino"
      title:
        de: "Der Schritt in die Musikszene"
        en: "Stepping into the music scene"
        it: "Il passo nella scena musicale"
      text:
        de: "In Mailand habe ich Artists im Management begleitet und Social-Media- und Content-Strategien mit über 30.000 Views pro Beitrag umgesetzt. 2025 folgte der bewusste Schritt nach Berlin: dorthin, wo Musik gemacht, vermarktet und gefördert wird."
        en: "In Milan I managed artists and ran social media and content strategies with more than 30,000 views per post. In 2025 I made the deliberate move to Berlin, where music is made, marketed and supported."
        it: "A Milano ho seguito artisti nel management e realizzato strategie social e di contenuto con oltre 30.000 visualizzazioni per post. Nel 2025 il passo deciso: il trasferimento a Berlino, dove la musica si crea, si promuove e si sostiene."
      image:
        src: "/images/works/music-project/foto-con-renis.webp"
        position: "center 22%"
        alt:
          de: "Luca Invernizzi und der Artist Renis im Tonstudio"
          en: "Luca Invernizzi and the artist Renis in the recording studio"
          it: "Luca Invernizzi e l'artista Renis in studio di registrazione"
      link:
        label:
          de: "Musikprojekt ansehen"
          en: "View the music project"
          it: "Vedi il progetto musicale"
        href: "/arbeiten/eigenes-musikprojekt/"

