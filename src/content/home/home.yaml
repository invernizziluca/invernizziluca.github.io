          alt:
            de: "Instagram-Insights: 83.767 Aufrufe in 14 Tagen, 59,8 Prozent von Nicht-Followern, 4.775 erreichte Konten"
            en: "Instagram insights: 83,767 views in 14 days, 59.8 percent from non-followers, 4,775 accounts reached"
            it: "Insights di Instagram: 83.767 visualizzazioni in 14 giorni, 59,8 per cento da non follower, 4.775 account raggiunti"
      case: "verbano-unihockey"
