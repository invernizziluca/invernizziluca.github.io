      text:
        de: "Ehrenamtlich habe ich Redaktionsplanung, Beiträge und die Website des Tessiner Unihockeyvereins betreut und mit den Instagram-Insights geplant."
        en: "As a volunteer I handled editorial planning, posts and the website of the Ticino floorball club, using Instagram insights to plan."
