  intro:
    de: "Veröffentlichte Arbeiten und belegte Ergebnisse. Bei jeder Arbeit steht, was mein Anteil war und was vom Team oder von anderen stammt."
    en: "Published work and documented results. Each item says what my part was and what came from the team or from others."
