# Chapter 06 – where I want to go
next:
  name:
    de: "Nächster Schritt"
    en: "Next step"
    it: "Prossimo passo"
  title:
    de: "Wohin ich will."
    en: "Where I'm heading."
    it: "Dove voglio arrivare."
  text:
    de: "Ich will dort wachsen, wo Strategie und Artists zusammenkommen: in Music Marketing, PR, Artist Management und Creative Operations."
    en: "I want to grow where strategy and artists meet: in music marketing, PR, artist management and creative operations."
    it: "Voglio crescere dove strategia e artisti si incontrano: nel music marketing, nelle PR, nell'artist management e nelle creative operations."
  areas:
    - title:
        de: "Music Marketing"
        en: "Music marketing"
        it: "Music marketing"
      text:
        de: "Release- und Content-Planung, Playlists und Social Media, mit Blick auf Daten und Community."
        en: "Release and content planning, playlists and social media, with an eye on data and community."
        it: "Pianificazione di release e contenuti, playlist e social media, con attenzione a dati e community."
    - title:
        de: "PR & Kommunikation"
        en: "PR & communication"
        it: "PR e comunicazione"
      text:
        de: "Pressearbeit, Medienmonitoring, Newsletter und klare Texte für Artists und Institutionen."
        en: "Press work, media monitoring, newsletters and clear copy for artists and institutions."
        it: "Ufficio stampa, media monitoring, newsletter e testi chiari per artisti e istituzioni."
    - title:
        de: "Artist Management"
        en: "Artist management"
        it: "Artist management"
      text:
        de: "Artists organisatorisch und kommunikativ begleiten, von der ersten Idee bis zum Release."
        en: "Supporting artists in organisation and communication, from the first idea to the release."
        it: "Accompagnare gli artisti nell'organizzazione e nella comunicazione, dalla prima idea alla release."
    - title:
        de: "Creative Operations"
        en: "Creative operations"
        it: "Creative operations"
      text:
        de: "Abläufe, Tools und Zeitpläne so strukturieren, dass kreative Arbeit Raum bekommt."
        en: "Structuring processes, tools and timelines so that creative work has room to happen."
        it: "Strutturare processi, strumenti e tempistiche perché il lavoro creativo abbia spazio."
  skillsTitle:
    de: "Sprachen und Tools"
    en: "Languages and tools"
    it: "Lingue e strumenti"

