# VORLAGE / TEMPLATE · nuovo riscontro (certificato, articolo, ricerca, Zeugnis)
# Copia in  src/content/nachweise/<nome>.yaml
# Il PDF va in public/pdf/... ; l'anteprima (facoltativa) in public/images/proof/...
#
# PRIVACY: prima di caricare un PDF annerisci data di nascita, indirizzo, telefono, luogo di origine
# (stampa in PDF come immagine o usa una redazione vera, non un rettangolo nero sopra il testo).
#
# "type" decide l'etichetta del documento in "Nachweise":
#   zeugnis    -> Zeugnis          (Praktikums- und Arbeitszeugnisse)
#   zertifikat -> Zertifikat       (corsi, programmi, planspiele)
#   artikel    -> Artikel          (articoli in cui sei citato o raccontato)
#   forschung  -> Forschungsarbeit (lavori di ricerca, progetti universitari)
#   empfehlung -> Empfehlung       (lettere di raccomandazione)
order: 8                       # posizione nella lista "Dokumente" (numero più basso = più in alto)
type: "zertifikat"             # zeugnis | zertifikat | artikel | forschung | empfehlung
date: "2026-12-01"             # sempre tra virgolette
source: "Chi lo ha emesso, es. FFHS"
pdf: "/pdf/certificates/nome.pdf"          # oppure togli questa riga
# url: "https://…"                         # per articoli online
image: "/images/proof/nome.webp"           # facoltativo
de:
  title: "Titel"
  summary: "Ein Satz, was das Dokument belegt."
en:
  title: "Title"
  summary: "One sentence on what it proves."
it:
  title: "Titolo"
  summary: "Una frase su cosa dimostra."
